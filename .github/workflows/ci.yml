name: QA Orchestrator CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.30"
          prune-cache: true

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run installation doctor
        run: uv run qa-orchestrator-doctor --json

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check launcher syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/qa-orchestrator

      - name: Install built wheel
        run: >
          uv run python -c 'import glob, subprocess, sys; subprocess.run(["uv", "pip", "install", "--python", sys.executable, "--no-deps", "--reinstall", *glob.glob("dist/*.whl")], check=True)'

      - name: Smoke-test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: uv run --project "${{ github.workspace }}" --no-sync python -m qa_orchestrator.doctor --json
