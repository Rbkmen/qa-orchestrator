name: QA Orchestrator CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.30"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run installation doctor
        run: uv run qa-orchestrator-doctor --json

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check launcher syntax
        run: sh -n scripts/qa-orchestrator

      - name: Install built wheel
        run: uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl

      - name: Smoke-test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: ${{ github.workspace }}/.venv/bin/qa-orchestrator-doctor --json
